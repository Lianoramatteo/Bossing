<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> for my bossing</title>
  <style>
    body {
      margin: 0;
      background-color: #05080f;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      font-family: Arial, sans-serif;
    }
    canvas {
      display: block;
    }
  </style>
</head>
<body>

<canvas id="heartCanvas"></canvas>

<script>
  const canvas = document.getElementById("heartCanvas");
  const ctx = canvas.getContext("2d");

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  let width = canvas.width;
  let height = canvas.height;

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    width = canvas.width;
    height = canvas.height;
  });

  function getHeartPoint(t, scale = 14) {
    const x = scale * 16 * Math.pow(Math.sin(t), 3);
    const y = -scale * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
    return {
      x: width / 2 + x,
      y: height / 2 + 30 + y
    };
  }

  // --- Heart Text Particles Setup ---
  const particles = [];
  const numPoints = 260; // Increased particle density for a richer heart shape
  const texts = ["I Love You", "Love You", "[Love You]"];

  for (let i = 0; i < numPoints; i++) {
    const t = (i / numPoints) * 2 * Math.PI;
    const h = getHeartPoint(t, 12);

    for (let density = 0; density < 3; density++) {
      const rOffset = 0.7 + Math.random() * 0.3;
      const px = width / 2 + (h.x - width / 2) * rOffset + (Math.random() * 16 - 8);
      const py = (height / 2 + 30) + (h.y - (height / 2 + 30)) * rOffset + (Math.random() * 16 - 8);

      particles.push({
        x: px,
        y: py,
        alpha: 0,
        flickerSpeed: 0.03 + Math.random() * 0.05, // Sped up flickering effect
        flickerOffset: Math.random() * Math.PI * 2,
        text: texts[Math.floor(Math.random() * texts.length)]
      });
    }
  }

  particles.sort((a, b) => a.y - b.y);
  particles.forEach((p, idx) => {
    p.delay = idx * 0.3; // Significantly reduced delay so the heart builds much faster
  });

  // --- Free-Flying Butterfly Setup ---
  const butterflyColors = [
    { wing: "rgba(255, 120, 200, 0.9)", glow: "#ff78c8" },
    { wing: "rgba(120, 220, 255, 0.9)", glow: "#78dcff" },
    { wing: "rgba(255, 215, 0, 0.9)",   glow: "#ffd700" },
    { wing: "rgba(180, 130, 255, 0.9)", glow: "#b482ff" },
    { wing: "rgba(255, 100, 100, 0.9)", glow: "#ff6464" },
    { wing: "rgba(100, 255, 180, 0.9)", glow: "#64ffb4" },
    { wing: "rgba(255, 165, 0, 0.9)",   glow: "#ffa500" },
    { wing: "rgba(238, 130, 238, 0.9)", glow: "#ee82ee" },
    { wing: "rgba(0, 255, 255, 0.9)",   glow: "#00ffff" },
    { wing: "rgba(255, 192, 203, 0.9)", glow: "#ffb6c1" }
  ];

  class Butterfly {
    constructor(colorScheme) {
      this.color = colorScheme;
      this.x = Math.random() * width;
      this.y = Math.random() * height;
      this.speed = 1.5 + Math.random() * 1.5;
      this.angle = Math.random() * Math.PI * 2;
      this.wingSpeed = 0.15 + Math.random() * 0.1;
      this.flap = Math.random() * Math.PI;
      this.noiseOffset = Math.random() * 1000;
      this.trail = [];
    }

    update() {
      this.flap += this.wingSpeed;

      this.noiseOffset += 0.01;
      this.angle += (Math.sin(this.noiseOffset) * 0.15);

      const margin = 80;
      if (this.x < margin) this.angle += 0.08;
      if (this.x > width - margin) this.angle += 0.08;
      if (this.y < margin) this.angle += 0.08;
      if (this.y > height - margin) this.angle += 0.08;

      this.x += Math.cos(this.angle) * this.speed;
      this.y += Math.sin(this.angle) * this.speed;

      if (Math.random() < 0.4) {
        this.trail.push({
          x: this.x + (Math.random() * 6 - 3),
          y: this.y + (Math.random() * 6 - 3),
          alpha: 0.8,
          size: 1 + Math.random() * 2
        });
      }

      for (let i = this.trail.length - 1; i >= 0; i--) {
        this.trail[i].alpha -= 0.02;
        if (this.trail[i].alpha <= 0) {
          this.trail.splice(i, 1);
        }
      }
    }

    draw(ctx) {
      this.trail.forEach(t => {
        ctx.save();
        ctx.shadowColor = this.color.glow;
        ctx.shadowBlur = 6;
        ctx.fillStyle = `rgba(255, 255, 255, ${t.alpha})`;
        ctx.beginPath();
        ctx.arc(t.x, t.y, t.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      ctx.save();
      ctx.translate(this.x, this.y);
      ctx.rotate(this.angle + Math.PI / 2);

      const wingScale = Math.abs(Math.sin(this.flap));

      ctx.shadowColor = this.color.glow;
      ctx.shadowBlur = 12;
      ctx.fillStyle = this.color.wing;

      ctx.beginPath();
      ctx.ellipse(-8 * wingScale, -3, 11 * wingScale, 7, Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(8 * wingScale, -3, 11 * wingScale, 7, -Math.PI / 4, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(-5 * wingScale, 5, 7 * wingScale, 5, -Math.PI / 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.ellipse(5 * wingScale, 5, 7 * wingScale, 5, Math.PI / 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#ffffff";
      ctx.fillRect(-1, -7, 2, 14);

      ctx.restore();
    }
  }

  const butterflies = Array.from({ length: 50 }, () => {
    const randomColor = butterflyColors[Math.floor(Math.random() * butterflyColors.length)];
    return new Butterfly(randomColor);
  });

  // --- Animation Loop ---
  let frame = 0;

  function animate() {
    requestAnimationFrame(animate);
    frame++;

    ctx.fillStyle = "#05080f";
    ctx.fillRect(0, 0, width, height);

    // Draw Heart Text Particles (Accelerated Fade-In & Pulsing Beat)
    const heartPulse = 1 + 0.03 * Math.sin(frame * 0.1); // Dynamic beating heart pulsation

    ctx.save();
    ctx.translate(width / 2, height / 2 + 30);
    ctx.scale(heartPulse, heartPulse);
    ctx.translate(-width / 2, -(height / 2 + 30));

    ctx.font = "bold 12px Arial";
    particles.forEach(p => {
      if (frame > p.delay) {
        if (p.alpha < 0.9) p.alpha += 0.03; // Accelerated fade-in rate

        const flicker = 0.75 + 0.25 * Math.sin(frame * p.flickerSpeed + p.flickerOffset);
        const currentAlpha = p.alpha * flicker;

        ctx.shadowColor = "rgba(0, 150, 255, 0.8)";
        ctx.shadowBlur = 8;
        ctx.fillStyle = `rgba(120, 220, 255, ${currentAlpha})`;
        ctx.fillText(p.text, p.x, p.y);
      }
    });
    ctx.restore();

    // Top Main Text Positioned Directly Above the Heart (Fade-in speed boosted)
    const centerAlpha = Math.max(0, Math.min(1, (frame - 80) * 0.015));
    if (centerAlpha > 0) {
      ctx.font = "bold 32px Georgia";
      ctx.shadowColor = "rgba(0, 150, 255, 1)";
      ctx.shadowBlur = 18;
      ctx.fillStyle = `rgba(120, 220, 255, ${centerAlpha})`;
      ctx.textAlign = "center";
      ctx.fillText("I Love Youuuuuuuuu Bosssss Mwa Mwa", width / 2, height / 2 - 210);
    }

    // Draw All Flying Butterflies
    butterflies.forEach(b => {
      b.update();
      b.draw(ctx);
    });
  }

  animate();
</script>

</body>
</html>
